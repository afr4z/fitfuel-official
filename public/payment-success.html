<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Successful – FitFuel Nutrition</title>
    <meta
      name="description"
      content="Your FitFuel Nutrition meal plan subscription is being activated. Thank you for choosing FitFuel Nutrition."
    />
    <link
      rel="preload"
      href="/fonts/archivo-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/css/nav.css" />
    <link rel="stylesheet" href="/css/main.css" />
    <style>
      /* Hallmark · genre: editorial · macrostructure: 05 Workbench ·
         design-system: design.md · designed-as-app
         ─────────────────────────────────────────────────────────────────
         This page used to set body{overflow:hidden} behind two floating
         gradient orbs, a blurred glass card, a gradient check disc with a
         green glow, and a pop animation with overshoot. All of it is a
         named tell, and the overflow:hidden trapped any content that did
         not fit. Flat paper, a real confirmation mark, no entrance
         choreography — the message is the design. */
      body {
        background: var(--color-paper);
        font-family: var(--font-body);
        color: var(--color-ink);
      }
      .success-page {
        min-height: calc(100vh - 135px);
        padding: var(--space-3xl) var(--page-gutter);
        padding-inline: max(var(--page-gutter), calc((100% - 1120px) / 2));
      }
      .card {
        max-width: 460px;
        border-top: 2px solid var(--color-ink-display);
        padding-top: var(--space-xl);
      }
      .check-wrap {
        width: 44px;
        height: 44px;
        margin-bottom: var(--space-lg);
        background: var(--color-brand);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .check-wrap svg {
        width: 24px;
        height: 24px;
        color: var(--color-paper);
      }
      h1 {
        font-family: var(--font-display);
        font-size: var(--text-3xl);
        font-weight: 800;
        color: var(--color-ink-display);
        margin-bottom: var(--space-xs);
        letter-spacing: var(--tracking-display);
      }
      .lead {
        color: var(--color-muted);
        font-size: var(--text-lg);
        line-height: 1.6;
        margin-bottom: var(--space-sm);
        max-width: 46ch;
      }
      .lead strong {
        color: var(--color-ink);
      }
      .note {
        margin-top: var(--space-lg);
        background: var(--color-brand-tint);
        border: 1px solid var(--color-rule);
        border-radius: var(--radius-sm);
        padding: var(--space-md);
        color: var(--color-ink);
        font-size: var(--text-sm);
        display: flex;
        align-items: flex-start;
        gap: var(--space-sm);
        text-align: left;
      }
      .note svg {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        color: var(--color-accent);
        margin-top: 2px;
      }
      /* Block-level so each action takes its own line. As inline-flex they
         ran together into one ambiguous row once the card went left-aligned. */
      .cta {
        display: flex;
        align-items: center;
        gap: var(--space-xs);
        margin-top: var(--space-lg);
        color: var(--color-accent);
        font-size: var(--text-sm);
        font-weight: 600;
        transition: color var(--dur-short) var(--ease-base);
        text-decoration: none;
        width: fit-content;
      }
      .cta:hover {
        color: var(--color-ink);
      }
      .brand {
        margin-top: var(--space-xl);
        padding-top: var(--space-md);
        border-top: 1px solid var(--color-rule);
        font-size: var(--text-xs);
        color: var(--color-faint);
        font-weight: 500;
      }
      .brand strong {
        color: var(--color-ink);
      }
      .spinner {
        width: 18px;
        height: 18px;
        border: 2px solid var(--color-rule);
        border-top-color: var(--color-brand);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 0 var(--space-md);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .redirecting {
        color: var(--color-muted);
        font-size: var(--text-sm);
        margin-top: var(--space-lg);
      }

      @media (max-width: 480px) {
        .success-page {
          padding: var(--space-2xl) var(--page-gutter);
        }
      }
    </style>
    <!-- Start the auth check as early as possible. nav.js is deferred, so a
         fetch inside it cannot start until the script has downloaded and
         run; from <head> this request leaves while the rest of the document
         is still downloading. It lives in <head> rather than beside the
         nav.js tag because on script-heavy pages (/order) the parser does
         not reach the end of <body> until ~690ms, which left the request
         serialised behind parsing. The script blocks for ~0ms — it only
         issues a fetch. nav.js consumes window.__ffAuth. -->
    <script>
      window.__ffAuth = fetch("/api/auth/me", { credentials: "include" })
        .then((r) => (r.ok ? r.json() : null))
        .catch(() => null);
    </script>
  </head>
  <body>
    <div id="nav-placeholder"></div>

    <div class="success-page">
      <div class="card" id="card">
      <div class="check-wrap">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M20 6L9 17l-5-5" />
        </svg>
      </div>
      <h1>Payment Successful!</h1>
      <p class="lead">
        Thank you for choosing <strong>FitFuel Nutrition</strong>.<br />Your
        meal plan subscription is now being activated.
      </p>
      <div class="note">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="2" y="2" width="20" height="20" rx="5" />
          <path d="M12 6v6l4 2" />
        </svg>
        <span
          >You'll receive a confirmation message on WhatsApp shortly with your
          plan details.</span
        >
      </div>
      <div class="spinner" id="spinner"></div>
      <p class="redirecting" id="redirecting">Signing you in…</p>
      <a
        class="cta"
        href="https://wa.me/916300159766"
        target="_blank"
        rel="noopener"
        id="whatsapp-link"
        style="display: none"
      >
        Message us on WhatsApp
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12h14" />
          <path d="M12 5l7 7-7 7" />
        </svg>
      </a>
      <a
        class="cta"
        href="/dashboard"
        id="dashboard-link"
        style="display: none"
      >
        Go to Dashboard
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12h14" />
          <path d="M12 5l7 7-7 7" />
        </svg>
      </a>
      <p class="brand">
        <strong>Fit<span class="wordmark-accent">Fuel</span></strong> Nutrition
        &mdash; Fresh meals, every day
      </p>
      </div>
    </div>

    <script>
      (async function () {
        const urlParams = new URLSearchParams(window.location.search);
        const referenceId = urlParams.get("razorpay_payment_link_reference_id");

        async function tryMagicLogin() {
          if (!referenceId) {
            showFallback();
            return;
          }
          try {
            const res = await fetch(
              `/api/auth/magic-login?reference_id=${encodeURIComponent(referenceId)}`,
              {
                method: "GET",
                credentials: "include",
              },
            );
            const data = await res.json();
            if (res.ok && data.success) {
              document.getElementById("redirecting").textContent =
                "Signed in! Redirecting to dashboard…";
              setTimeout(() => (window.location.href = "/dashboard"), 800);
            } else {
              console.warn("Magic login failed:", data.error);
              showFallback();
            }
          } catch (err) {
            console.error("Magic login error:", err);
            showFallback();
          }
        }

        function showFallback() {
          document.getElementById("spinner").style.display = "none";
          document.getElementById("redirecting").textContent =
            "Payment complete. You can now access your dashboard.";
          document.getElementById("whatsapp-link").style.display =
            "inline-flex";
          document.getElementById("dashboard-link").style.display =
            "inline-flex";
        }

        await tryMagicLogin();
      })();
    </script>
    <script src="/js/nav.js" defer></script>
  </body>
</html>
