<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – FitFuel Nutrition</title>
    <meta
      name="description"
      content="Sign in to FitFuel Nutrition to manage your meal plans and orders."
    />
    <link
      rel="preload"
      href="/fonts/archivo-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/css/nav.css" />
    <link rel="stylesheet" href="/css/main.css" />
    <style>
      /* Hallmark · genre: editorial · macrostructure: 05 Workbench ·
         design-system: design.md · designed-as-app
         ─────────────────────────────────────────────────────────────────
         An app page carries function, not theatre. One measure, labelled
         fields, hairline rules, no gradient, no glass, no entrance
         animation. The block is anchored to the left measure rather than
         floated in the centre of the viewport — the asymmetry is the point. */
      .login-page {
        min-height: calc(100vh - 135px);
        padding: var(--space-3xl) var(--page-gutter);
        padding-inline: max(var(--page-gutter), calc((100% - 1120px) / 2));
        display: flex;
        align-items: flex-start;
        background: var(--color-paper);
      }
      .auth-card {
        width: 100%;
        max-width: 420px;
        background: transparent;
        border: 0;
        border-top: 2px solid var(--color-ink-display);
        border-radius: 0;
        padding: var(--space-xl) 0 0;
      }
      .auth-title {
        font-family: var(--font-display);
        font-size: var(--text-3xl);
        font-weight: 800;
        font-stretch: 103%;
        color: var(--color-ink-display);
        text-align: left;
        margin-bottom: var(--space-2xs);
        letter-spacing: var(--tracking-display);
      }
      .auth-subtitle {
        text-align: left;
        color: var(--color-muted);
        margin-bottom: var(--space-xl);
        font-size: var(--text-md);
        max-width: 38ch;
      }

      .step {
        display: none;
      }
      .step.active {
        display: block;
      }

      .form-group {
        margin-bottom: var(--space-md);
      }
      .form-label {
        display: block;
        font-size: var(--text-xs);
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--color-muted);
        margin-bottom: var(--space-2xs);
      }
      .form-input,
      .otp-input {
        width: 100%;
        padding: 13px var(--space-md);
        font-size: var(--text-md);
        font-family: inherit;
        border: 1px solid var(--color-rule-strong);
        border-radius: var(--radius-sm);
        background: var(--color-paper);
        color: var(--color-ink);
        transition:
          border-color var(--dur-short) var(--ease-base),
          background var(--dur-short) var(--ease-base);
      }
      /* The focus ring is the global one from main.css — no coloured glow. */
      .form-input:focus-visible,
      .otp-input:focus-visible {
        border-color: var(--color-focus);
      }
      .form-input::placeholder {
        color: var(--color-faint);
      }
      .form-input.error {
        border-color: var(--color-danger);
      }
      .otp-input {
        letter-spacing: 0.5rem;
        text-align: center;
        font-size: var(--text-xl);
        font-weight: 600;
      }
      .form-error {
        font-size: var(--text-xs);
        color: var(--color-danger);
        margin-top: var(--space-2xs);
        display: none;
      }
      .form-error.visible {
        display: block;
      }

      .auth-actions .btn-primary,
      .auth-actions .btn-secondary {
        width: 100%;
        justify-content: center;
      }
      .btn-primary:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        transform: none;
      }

      .error-banner {
        background: var(--color-danger-tint);
        border: 1px solid var(--color-danger);
        color: var(--color-danger);
        padding: var(--space-sm) var(--space-md);
        border-radius: var(--radius-sm);
        margin-bottom: var(--space-md);
        font-size: var(--text-sm);
        display: none;
      }
      .error-banner.visible {
        display: block;
      }
      .success-banner {
        background: var(--color-brand-tint);
        border: 1px solid var(--color-brand);
        color: var(--color-ink);
        padding: var(--space-sm) var(--space-md);
        border-radius: var(--radius-sm);
        margin-bottom: var(--space-md);
        font-size: var(--text-sm);
        display: none;
      }
      .success-banner.visible {
        display: block;
      }

      .resend {
        text-align: left;
        margin-top: var(--space-md);
        font-size: var(--text-sm);
        color: var(--color-muted);
      }
      .resend button {
        background: none;
        border: none;
        color: var(--color-accent);
        font-weight: 600;
        cursor: pointer;
        font-size: inherit;
        font-family: inherit;
        padding: 0;
      }
      .resend button:disabled {
        color: var(--color-faint);
        cursor: not-allowed;
      }

      /* A spinner is a real state, not decoration, so it stays — but it
         inherits the button's own ink rather than hard-coded white. */
      .loading {
        display: none;
        align-items: center;
        justify-content: center;
        gap: var(--space-xs);
      }
      .loading.visible {
        display: flex;
      }
      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .auth-security {
        display: flex;
        align-items: center;
        gap: var(--space-2xs);
        margin-top: var(--space-lg);
        padding-top: var(--space-md);
        border-top: 1px solid var(--color-rule);
        font-size: var(--text-xs);
        color: var(--color-muted);
      }
      .auth-security svg {
        color: var(--color-accent);
        flex-shrink: 0;
      }
      .auth-footer {
        text-align: left;
        margin-top: var(--space-sm);
        font-size: var(--text-xs);
        color: var(--color-faint);
      }
      .auth-footer a {
        color: var(--color-accent);
        font-weight: 500;
      }

      @media (max-width: 480px) {
        .login-page {
          padding: var(--space-2xl) var(--page-gutter);
        }
        .auth-card {
          padding-top: var(--space-lg);
        }
      }
    </style>
    <!-- Start the auth check as early as possible. nav.js is deferred, so a
         fetch inside it cannot start until the script has downloaded and
         run; from <head> this request leaves while the rest of the document
         is still downloading. It lives in <head> rather than beside the
         nav.js tag because on script-heavy pages (/order) the parser does
         not reach the end of <body> until ~690ms, which left the request
         serialised behind parsing. The script blocks for ~0ms — it only
         issues a fetch. nav.js consumes window.__ffAuth. -->
    <script>
      window.__ffAuth = fetch("/api/auth/me", { credentials: "include" })
        .then((r) => (r.ok ? r.json() : null))
        .catch(() => null);
    </script>
  </head>
  <body>
    <div id="nav-placeholder"></div>

    <div class="login-page">
      <div class="auth-card">
        <div class="error-banner" id="error-banner" role="alert"></div>
        <div class="success-banner" id="success-banner"></div>

        <div class="step active" id="step-phone" data-step="1">
          <h1 class="auth-title">Welcome back</h1>
          <p class="auth-subtitle">
            Enter your phone number to receive a login code via WhatsApp
          </p>
          <form id="phone-form">
            <div class="form-group">
              <label class="form-label" for="phone">Phone Number</label>
              <input
                type="tel"
                class="form-input"
                id="phone"
                placeholder="9876543210"
                autocomplete="tel"
                pattern="[0-9]{10}"
                maxlength="10"
                required
              />
              <div class="form-error" id="phone-error">
                Enter a valid 10-digit Indian mobile number
              </div>
            </div>
            <div class="auth-actions">
              <button type="submit" class="btn-primary" id="btn-send-otp">
                <span>Send OTP via WhatsApp</span>
                <div class="loading" id="loading-send">
                  <div class="spinner"></div>
                </div>
              </button>
            </div>
          </form>
        </div>

        <div class="step" id="step-otp" data-step="2">
          <h1 class="auth-title">Verify Code</h1>
          <p class="auth-subtitle">
            We sent a 6-digit code to <strong id="phone-display"></strong>
          </p>
          <form id="otp-form">
            <div class="form-group">
              <label class="form-label" for="otp">Enter OTP</label>
              <input
                type="text"
                class="otp-input"
                id="otp"
                placeholder="000000"
                autocomplete="one-time-code"
                pattern="[0-9]{6}"
                maxlength="6"
                required
              />
              <div class="form-error" id="otp-error">
                Invalid or expired code
              </div>
            </div>
            <div class="auth-actions">
              <button type="submit" class="btn-primary" id="btn-verify-otp">
                <span>Verify &amp; Sign In</span>
                <div class="loading" id="loading-verify">
                  <div class="spinner"></div>
                </div>
              </button>
            </div>
          </form>
          <div class="resend">
            Didn't receive it?
            <button type="button" id="btn-resend" disabled>
              Resend in <span id="resend-timer">30</span>s
            </button>
          </div>
          <div class="auth-actions" style="margin-top: 12px">
            <button type="button" class="btn-secondary" id="btn-back-phone">
              ← Change number
            </button>
          </div>
        </div>

        <div class="auth-security">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          Secure login via WhatsApp
        </div>

        <p class="auth-footer">
          New here? <a href="/order">Continue to order</a>
        </p>
      </div>
    </div>

    <script>
      const API_BASE = "/api/auth";
      let resendCountdown = 30;
      let resendTimer = null;

      const stepPhone = document.getElementById("step-phone");
      const stepOtp = document.getElementById("step-otp");
      const phoneInput = document.getElementById("phone");
      const otpInput = document.getElementById("otp");
      const phoneDisplay = document.getElementById("phone-display");
      const btnSendOtp = document.getElementById("btn-send-otp");
      const btnVerifyOtp = document.getElementById("btn-verify-otp");
      const btnResend = document.getElementById("btn-resend");
      const btnBackPhone = document.getElementById("btn-back-phone");
      const loadingSend = document.getElementById("loading-send");
      const loadingVerify = document.getElementById("loading-verify");
      const resendTimerEl = document.getElementById("resend-timer");
      const errorBanner = document.getElementById("error-banner");
      const successBanner = document.getElementById("success-banner");

      function showError(msg) {
        errorBanner.textContent = msg;
        errorBanner.classList.add("visible");
        successBanner.classList.remove("visible");
      }
      function showSuccess(msg) {
        successBanner.textContent = msg;
        successBanner.classList.add("visible");
        errorBanner.classList.remove("visible");
      }
      function hideMessages() {
        errorBanner.classList.remove("visible");
        successBanner.classList.remove("visible");
      }
      function setLoading(btn, loading, loadingEl) {
        btn.disabled = loading;
        if (loading) {
          btn.querySelector("span").style.display = "none";
          loadingEl.classList.add("visible");
        } else {
          btn.querySelector("span").style.display = "inline";
          loadingEl.classList.remove("visible");
        }
      }
      function showStep(step) {
        stepPhone.classList.toggle("active", step === 1);
        stepOtp.classList.toggle("active", step === 2);
      }
      function startResendCountdown() {
        resendCountdown = 30;
        btnResend.disabled = true;
        resendTimerEl.textContent = resendCountdown;
        resendTimer = setInterval(() => {
          resendCountdown--;
          resendTimerEl.textContent = resendCountdown;
          if (resendCountdown <= 0) {
            clearInterval(resendTimer);
            btnResend.disabled = false;
            resendTimerEl.textContent = "30";
          }
        }, 1000);
      }
      function formatPhone(phone) {
        return phone.replace(/(\d{5})(\d{5})/, "$1 $2");
      }

      document
        .getElementById("phone-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          hideMessages();
          const phone = phoneInput.value.trim();
          if (!/^[0-9]{10}$/.test(phone)) {
            phoneInput.classList.add("error");
            document.getElementById("phone-error").classList.add("visible");
            return;
          }
          phoneInput.classList.remove("error");
          document.getElementById("phone-error").classList.remove("visible");

          setLoading(btnSendOtp, true, loadingSend);
          try {
            const res = await fetch(`${API_BASE}/send-otp`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ phone }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Failed to send OTP");
            phoneDisplay.textContent = formatPhone(phone);
            showSuccess(data.message);
            showStep(2);
            otpInput.focus();
            startResendCountdown();
          } catch (err) {
            showError(err.message);
          } finally {
            setLoading(btnSendOtp, false, loadingSend);
          }
        });

      document
        .getElementById("otp-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          hideMessages();
          const phone = phoneInput.value.trim();
          const otp = otpInput.value.trim();
          if (!/^[0-9]{6}$/.test(otp)) {
            otpInput.classList.add("error");
            document.getElementById("otp-error").classList.add("visible");
            return;
          }
          otpInput.classList.remove("error");
          document.getElementById("otp-error").classList.remove("visible");

          setLoading(btnVerifyOtp, true, loadingVerify);
          try {
            const res = await fetch(`${API_BASE}/verify-otp`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ phone, otp }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Verification failed");
            showSuccess("Signed in successfully!");
            setTimeout(() => (window.location.href = "/dashboard"), 800);
          } catch (err) {
            showError(err.message);
            otpInput.value = "";
            otpInput.focus();
          } finally {
            setLoading(btnVerifyOtp, false, loadingVerify);
          }
        });

      btnResend.addEventListener("click", async () => {
        hideMessages();
        const phone = phoneInput.value.trim();
        setLoading(btnSendOtp, true, loadingSend);
        btnResend.disabled = true;
        try {
          const res = await fetch(`${API_BASE}/send-otp`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Failed to resend OTP");
          showSuccess(data.message);
          startResendCountdown();
          otpInput.value = "";
          otpInput.focus();
        } catch (err) {
          showError(err.message);
          btnResend.disabled = false;
        } finally {
          setLoading(btnSendOtp, false, loadingSend);
        }
      });

      btnBackPhone.addEventListener("click", () => {
        hideMessages();
        clearInterval(resendTimer);
        showStep(1);
        phoneInput.focus();
      });

      phoneInput.addEventListener("input", () => {
        phoneInput.classList.remove("error");
        document.getElementById("phone-error").classList.remove("visible");
      });
      otpInput.addEventListener("input", () => {
        otpInput.classList.remove("error");
        document.getElementById("otp-error").classList.remove("visible");
      });
    </script>
    <script src="/js/nav.js" defer></script>
  </body>
</html>
