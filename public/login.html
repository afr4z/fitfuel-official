<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – FitFuel Nutrition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green-50: #f0fdf4; --green-100: #dcfce7; --green-200: #bbf7d0;
      --green-400: #4ade80; --green-500: #22c55e; --green-600: #16a34a;
      --green-700: #15803d; --green-800: #166534; --green-900: #14532d;
      --gray-50: #f9fafb; --gray-100: #f3f4f6; --gray-200: #e5e7eb;
      --gray-300: #d1d5db; --gray-400: #9ca3af; --gray-500: #6b7280;
      --gray-600: #4b5563; --gray-700: #374151; --gray-800: #1f2937;
      --gray-900: #111827; --red-500: #ef4444; --red-600: #dc2626;
      --radius-full: 9999px; --radius-lg: 16px; --radius-md: 10px; --radius-sm: 8px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1); --ease-base: cubic-bezier(0.4, 0, 0.2, 1);
      --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); color: var(--gray-800); background: #fff; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; padding: 24px 16px; }
    .nav { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.85); backdrop-filter: blur(16px); border-bottom: 1px solid var(--gray-200); padding: 14px 16px; margin: -24px -16px 24px; }
    .nav-inner { max-width: 720px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .nav-brand { font-size: 1.1rem; font-weight: 800; color: var(--green-800); }
    .nav-brand .accent { color: var(--green-500); }
    .card { background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: 32px; width: 100%; max-width: 420px; box-shadow: var(--shadow-sm); flex: 1; }
    .logo { text-align: center; margin-bottom: 24px; }
    .logo a { font-size: 1.5rem; font-weight: 800; color: var(--green-800); text-decoration: none; }
    .logo a .accent { color: var(--green-500); }
    h1 { font-size: 1.5rem; font-weight: 800; color: var(--gray-900); text-align: center; margin-bottom: 8px; }
    .subtitle { text-align: center; color: var(--gray-500); margin-bottom: 24px; font-size: 0.95rem; }
    .step { display: none; }
    .step.active { display: block; animation: fadeIn 0.3s var(--ease-out); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--gray-700); margin-bottom: 8px; }
    .form-input, .otp-input { width: 100%; padding: 14px 16px; font-size: 1rem; font-family: inherit; border: 1px solid var(--gray-300); border-radius: var(--radius-sm); background: #fff; color: var(--gray-900); transition: all 0.15s var(--ease-base); }
    .form-input:focus, .otp-input:focus { outline: none; border-color: var(--green-500); box-shadow: 0 0 0 3px rgba(34,197,94,0.15); }
    .form-input::placeholder { color: var(--gray-400); }
    .form-input.error { border-color: var(--red-500); }
    .otp-input { letter-spacing: 0.5rem; text-align: center; font-size: 1.25rem; font-weight: 600; }
    .form-error { font-size: 0.8rem; color: var(--red-500); margin-top: 6px; display: none; }
    .form-error.visible { display: block; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px 24px; font-size: 1rem; font-weight: 600; border-radius: var(--radius-md); border: none; cursor: pointer; transition: all 0.2s var(--ease-base); font-family: inherit; }
    .btn-primary { background: var(--green-500); color: #fff; box-shadow: 0 2px 8px rgba(34,197,94,0.25); }
    .btn-primary:hover:not(:disabled) { background: var(--green-600); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(34,197,94,0.35); }
    .btn-primary:disabled { background: var(--gray-300); color: var(--gray-500); cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-secondary { background: #fff; color: var(--green-700); border: 2px solid var(--green-200); }
    .btn-secondary:hover:not(:disabled) { border-color: var(--green-400); background: var(--green-50); }
    .error-banner { background: #fef2f2; border: 1px solid #fecaca; color: var(--red-600); padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 20px; font-size: 0.85rem; display: none; }
    .error-banner.visible { display: block; }
    .success-banner { background: var(--green-50); border: 1px solid var(--green-100); color: var(--green-700); padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 20px; font-size: 0.85rem; display: none; }
    .success-banner.visible { display: block; }
    .resend { text-align: center; margin-top: 16px; font-size: 0.85rem; color: var(--gray-500); }
    .resend button { background: none; border: none; color: var(--green-600); font-weight: 600; cursor: pointer; font-size: inherit; font-family: inherit; padding: 0; }
    .resend button:disabled { color: var(--gray-400); cursor: not-allowed; }
    .loading { display: none; align-items: center; justify-content: center; gap: 8px; }
    .loading.visible { display: flex; }
    .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer-note { text-align: center; margin-top: 24px; font-size: 0.75rem; color: var(--gray-400); }
    .footer-note a { color: var(--green-600); font-weight: 500; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-brand">Fit<span class="accent">Fuel</span> Nutrition</a>
      <div id="nav-auth"></div>
    </div>
  </nav>

  <div class="card">
    <div class="logo"><a href="/">Fit<span class="accent">Fuel</span> Nutrition</a></div>

    <div class="error-banner" id="error-banner" role="alert"></div>
    <div class="success-banner" id="success-banner"></div>

    <div class="step active" id="step-phone" data-step="1">
      <h1>Sign in to FitFuel</h1>
      <p class="subtitle">Enter your phone number to receive a login code via WhatsApp</p>
      <form id="phone-form">
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" class="form-input" id="phone" placeholder="9876543210" autocomplete="tel" pattern="[0-9]{10}" maxlength="10" required>
          <div class="form-error" id="phone-error">Enter a valid 10-digit Indian mobile number</div>
        </div>
        <button type="submit" class="btn btn-primary" id="btn-send-otp">
          <span>Send OTP via WhatsApp</span>
          <div class="loading" id="loading-send"><div class="spinner"></div></div>
        </button>
      </form>
    </div>

    <div class="step" id="step-otp" data-step="2">
      <h1>Verify Code</h1>
      <p class="subtitle">We sent a 6-digit code to <strong id="phone-display"></strong></p>
      <form id="otp-form">
        <div class="form-group">
          <label class="form-label">Enter OTP</label>
          <input type="text" class="otp-input" id="otp" placeholder="000000" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
          <div class="form-error" id="otp-error">Invalid or expired code</div>
        </div>
        <button type="submit" class="btn btn-primary" id="btn-verify-otp">
          <span>Verify & Sign In</span>
          <div class="loading" id="loading-verify"><div class="spinner"></div></div>
        </button>
      </form>
      <div class="resend">
        Didn't receive it? <button type="button" id="btn-resend" disabled>Resend in <span id="resend-timer">30</span>s</button>
      </div>
      <div class="resend" style="margin-top: 12px;">
        <button type="button" class="btn btn-secondary" id="btn-back-phone" style="width: auto; padding: 8px 16px;">← Change number</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/api/auth';
    let resendCountdown = 30;
    let resendTimer = null;

    const stepPhone = document.getElementById('step-phone');
    const stepOtp = document.getElementById('step-otp');
    const phoneInput = document.getElementById('phone');
    const otpInput = document.getElementById('otp');
    const phoneDisplay = document.getElementById('phone-display');
    const btnSendOtp = document.getElementById('btn-send-otp');
    const btnVerifyOtp = document.getElementById('btn-verify-otp');
    const btnResend = document.getElementById('btn-resend');
    const btnBackPhone = document.getElementById('btn-back-phone');
    const loadingSend = document.getElementById('loading-send');
    const loadingVerify = document.getElementById('loading-verify');
    const resendTimerEl = document.getElementById('resend-timer');
    const errorBanner = document.getElementById('error-banner');
    const successBanner = document.getElementById('success-banner');

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.classList.add('visible');
      successBanner.classList.remove('visible');
    }
    function showSuccess(msg) {
      successBanner.textContent = msg;
      successBanner.classList.add('visible');
      errorBanner.classList.remove('visible');
    }
    function hideMessages() {
      errorBanner.classList.remove('visible');
      successBanner.classList.remove('visible');
    }
    function setLoading(btn, loading, loadingEl) {
      btn.disabled = loading;
      if (loading) {
        btn.querySelector('span').style.display = 'none';
        loadingEl.classList.add('visible');
      } else {
        btn.querySelector('span').style.display = 'inline';
        loadingEl.classList.remove('visible');
      }
    }
    function showStep(step) {
      stepPhone.classList.toggle('active', step === 1);
      stepOtp.classList.toggle('active', step === 2);
    }
    function startResendCountdown() {
      resendCountdown = 30;
      btnResend.disabled = true;
      resendTimerEl.textContent = resendCountdown;
      resendTimer = setInterval(() => {
        resendCountdown--;
        resendTimerEl.textContent = resendCountdown;
        if (resendCountdown <= 0) {
          clearInterval(resendTimer);
          btnResend.disabled = false;
          resendTimerEl.textContent = '30';
        }
      }, 1000);
    }
    function formatPhone(phone) {
      return phone.replace(/(\d{5})(\d{5})/, '$1 $2');
    }

    document.getElementById('phone-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();
      const phone = phoneInput.value.trim();
      if (!/^[0-9]{10}$/.test(phone)) {
        phoneInput.classList.add('error');
        document.getElementById('phone-error').classList.add('visible');
        return;
      }
      phoneInput.classList.remove('error');
      document.getElementById('phone-error').classList.remove('visible');

      setLoading(btnSendOtp, true, loadingSend);
      try {
        const res = await fetch(`${API_BASE}/send-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to send OTP');
        phoneDisplay.textContent = formatPhone(phone);
        showSuccess(data.message);
        showStep(2);
        otpInput.focus();
        startResendCountdown();
      } catch (err) {
        showError(err.message);
      } finally {
        setLoading(btnSendOtp, false, loadingSend);
      }
    });

    document.getElementById('otp-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();
      const phone = phoneInput.value.trim();
      const otp = otpInput.value.trim();
      if (!/^[0-9]{6}$/.test(otp)) {
        otpInput.classList.add('error');
        document.getElementById('otp-error').classList.add('visible');
        return;
      }
      otpInput.classList.remove('error');
      document.getElementById('otp-error').classList.remove('visible');

      setLoading(btnVerifyOtp, true, loadingVerify);
      try {
        const res = await fetch(`${API_BASE}/verify-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, otp })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Verification failed');
        showSuccess('Signed in successfully!');
        setTimeout(() => window.location.href = '/dashboard', 800);
      } catch (err) {
        showError(err.message);
        otpInput.value = '';
        otpInput.focus();
      } finally {
        setLoading(btnVerifyOtp, false, loadingVerify);
      }
    });

    btnResend.addEventListener('click', async () => {
      hideMessages();
      const phone = phoneInput.value.trim();
      setLoading(btnSendOtp, true, loadingSend);
      btnResend.disabled = true;
      try {
        const res = await fetch(`${API_BASE}/send-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to resend OTP');
        showSuccess(data.message);
        startResendCountdown();
        otpInput.value = '';
        otpInput.focus();
      } catch (err) {
        showError(err.message);
        btnResend.disabled = false;
      } finally {
        setLoading(btnSendOtp, false, loadingSend);
      }
    });

    btnBackPhone.addEventListener('click', () => {
      hideMessages();
      clearInterval(resendTimer);
      showStep(1);
      phoneInput.focus();
    });

    phoneInput.addEventListener('input', () => {
      phoneInput.classList.remove('error');
      document.getElementById('phone-error').classList.remove('visible');
    });
    otpInput.addEventListener('input', () => {
      otpInput.classList.remove('error');
      document.getElementById('otp-error').classList.remove('visible');
    });
  </script>
  <script src="/js/auth-nav.js"></script>
</body>
</html>
