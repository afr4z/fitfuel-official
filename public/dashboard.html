<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard – FitFuel Nutrition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/nav.css" />
    <link rel="stylesheet" href="/css/main.css" />
    <style>
      /* brand palette lives in /css/main.css (single source of truth) */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--font);
        color: var(--gray-800);
        background: var(--gray-50);
        line-height: 1.6;
        min-height: 100vh;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 20px;
        font-size: 0.9rem;
        font-weight: 600;
        border-radius: var(--radius-md);
        border: none;
        cursor: pointer;
        transition: all 0.2s var(--ease-base);
        font-family: inherit;
      }
      .btn-secondary {
        background: #fff;
        color: var(--green-700);
        border: 2px solid var(--green-200);
      }
      .btn-secondary:hover {
        border-color: var(--green-400);
        background: var(--green-50);
      }
      .btn-ghost {
        background: transparent;
        color: var(--gray-600);
        border: none;
        padding: 8px 12px;
      }
      .btn-ghost:hover {
        color: var(--red-500);
        background: #fef2f2;
        border-radius: var(--radius-sm);
      }
      .container {
        max-width: 1120px;
        margin: 0 auto;
        padding: 32px 24px;
      }
      .page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 32px;
        flex-wrap: wrap;
        gap: 16px;
      }
      .page-title {
        font-size: 1.75rem;
        font-weight: 800;
        color: var(--gray-900);
      }
      .page-subtitle {
        color: var(--gray-500);
        margin-top: 4px;
      }
      .card {
        background: #fff;
        border: 1px solid var(--gray-200);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
      }
      .card-header {
        padding: 20px 24px;
        border-bottom: 1px solid var(--gray-200);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
      }
      .card-title {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--gray-900);
      }
      .card-content {
        padding: 24px;
      }
      .section {
        margin-bottom: 32px;
      }
      .empty-state {
        text-align: center;
        padding: 48px 24px;
        color: var(--gray-500);
      }
      .empty-state svg {
        width: 48px;
        height: 48px;
        margin-bottom: 12px;
        opacity: 0.5;
      }
      .empty-state h3 {
        font-size: 1rem;
        font-weight: 600;
        color: var(--gray-700);
        margin-bottom: 4px;
      }
      .empty-state p {
        font-size: 0.85rem;
      }
      .plan-card {
        border: 1px solid var(--gray-200);
        border-radius: var(--radius-md);
        padding: 20px;
        transition: all 0.2s var(--ease-base);
      }
      .plan-card:hover {
        box-shadow: var(--shadow-md);
        border-color: var(--green-200);
      }
      .plan-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .plan-info {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .plan-emoji {
        font-size: 2rem;
      }
      .plan-name {
        font-weight: 700;
        color: var(--gray-900);
        font-size: 1.1rem;
      }
      .plan-tag {
        font-size: 0.7rem;
        font-weight: 600;
        padding: 3px 10px;
        border-radius: var(--radius-full);
      }
      .tag-veg {
        background: var(--green-100);
        color: var(--green-800);
      }
      .tag-nonveg {
        background: #fef3c7;
        color: #92400e;
      }
      .plan-type {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--green-600);
        background: var(--green-50);
        padding: 4px 10px;
        border-radius: var(--radius-full);
        text-transform: uppercase;
      }
      .plan-dates {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-bottom: 16px;
      }
      .plan-date {
        background: var(--gray-50);
        border-radius: var(--radius-sm);
        padding: 10px 12px;
      }
      .plan-date-label {
        font-size: 0.7rem;
        font-weight: 600;
        color: var(--gray-400);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 2px;
      }
      .plan-date-value {
        font-weight: 600;
        color: var(--gray-900);
      }
      .plan-progress {
        margin-bottom: 16px;
      }
      .progress-bar {
        height: 6px;
        background: var(--gray-200);
        border-radius: 3px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: var(--green-500);
        border-radius: 3px;
        transition: width 0.4s var(--ease-out);
      }
      .progress-text {
        display: flex;
        justify-content: space-between;
        font-size: 0.8rem;
        color: var(--gray-500);
        margin-top: 6px;
      }
      .plan-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .meal-list {
        display: grid;
        gap: 12px;
      }
      .meal-card {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px;
        background: var(--gray-50);
        border-radius: var(--radius-md);
        border: 1px solid var(--gray-200);
      }
      .meal-date {
        font-weight: 700;
        color: var(--gray-900);
        white-space: nowrap;
        font-size: 0.9rem;
      }
      .meal-slot {
        font-size: 0.7rem;
        font-weight: 600;
        color: var(--green-600);
        background: var(--green-50);
        padding: 3px 10px;
        border-radius: var(--radius-full);
        text-transform: uppercase;
        white-space: nowrap;
      }
      .meal-item {
        flex: 1;
        color: var(--gray-700);
      }
      .meal-status {
        font-size: 0.75rem;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: var(--radius-full);
        text-transform: capitalize;
      }
      .status-pending {
        background: #fef3c7;
        color: #92400e;
      }
      .status-confirmed {
        background: var(--green-100);
        color: var(--green-800);
      }
      .status-skipped {
        background: var(--gray-100);
        color: var(--gray-600);
      }
      .profile-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
      }
      .profile-field {
        background: var(--gray-50);
        border-radius: var(--radius-md);
        padding: 16px;
      }
      .profile-label {
        font-size: 0.7rem;
        font-weight: 600;
        color: var(--gray-400);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 4px;
      }
      .profile-value {
        font-weight: 600;
        color: var(--gray-900);
      }
      .loading-state {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px;
        gap: 12px;
        color: var(--gray-500);
      }
      .spinner {
        width: 24px;
        height: 24px;
        border: 2px solid var(--gray-200);
        border-top-color: var(--green-500);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (max-width: 768px) {
        .container {
          padding: 24px 16px;
        }
        .page-header {
          flex-direction: column;
          align-items: flex-start;
        }
        .plan-dates {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="nav-placeholder"></div>

    <div class="container">
      <div class="page-header">
        <div>
          <h1 class="page-title">Dashboard</h1>
          <p class="page-subtitle">
            Manage your subscriptions and upcoming meals
          </p>
        </div>
        <a href="/order" class="btn btn-secondary">Order New Plan</a>
      </div>

      <div id="user-name" style="display: none"></div>

      <div class="section">
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Active Subscriptions</h2>
          </div>
          <div class="card-content" id="subscriptions-list">
            <div class="loading-state">
              <div class="spinner"></div>
              Loading…
            </div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Upcoming Meals</h2>
          </div>
          <div class="card-content" id="meals-list">
            <div class="loading-state">
              <div class="spinner"></div>
              Loading…
            </div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Profile</h2>
          </div>
          <div class="card-content" id="profile-info">
            <div class="loading-state">
              <div class="spinner"></div>
              Loading…
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/js/html-escape.js"></script>
    <script>
      const API_BASE = "/api/auth";

      async function fetchMe() {
        const res = await fetch(`${API_BASE}/me`, { credentials: "include" });
        if (!res.ok) {
          if (res.status === 401) window.location.href = "/login";
          throw new Error("Failed to load dashboard");
        }
        return res.json();
      }

      function formatDate(dateStr) {
        const d = new Date(dateStr + "T00:00:00Z");
        return d.toLocaleDateString("en-IN", {
          weekday: "short",
          day: "numeric",
          month: "short",
          year: "numeric",
        });
      }

      function formatDateShort(dateStr) {
        const d = new Date(dateStr + "T00:00:00Z");
        return d.toLocaleDateString("en-IN", {
          day: "numeric",
          month: "short",
        });
      }

      function calcProgress(start, end) {
        const today = new Date().toISOString().split("T")[0];
        const s = new Date(start + "T00:00:00Z");
        const e = new Date(end + "T00:00:00Z");
        const t = new Date(today + "T00:00:00Z");
        if (t < s) return 0;
        if (t > e) return 100;
        const total = (e - s) / (1000 * 60 * 60 * 24);
        const elapsed = (t - s) / (1000 * 60 * 60 * 24);
        return Math.round((elapsed / total) * 100);
      }

      function renderSubscriptions(subs) {
        const el = document.getElementById("subscriptions-list");
        if (!subs?.length) {
          el.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
            <h3>No active subscriptions</h3>
            <p>You don't have any active meal plans right now.</p>
          </div>
        `;
          return;
        }
        el.innerHTML = subs
          .map((sub) => {
            const plan = sub.meal_plans || {};
            const progress = calcProgress(sub.start_date, sub.end_date);
            return `
          <div class="plan-card">
            <div class="plan-header">
              <div class="plan-info">
                <span class="plan-emoji">${esc(plan.emoji) || "🥗"}</span>
                <div>
                  <div class="plan-name">${esc(plan.name) || "Meal Plan"}</div>
                  <span class="plan-tag ${plan.tag?.toLowerCase() === "veg" ? "tag-veg" : "tag-nonveg"}">${esc(plan.tag) || ""}</span>
                </div>
              </div>
              <span class="plan-type">${esc(sub.plan_type?.replace("3day", "3-Day") || sub.plan_type)}</span>
            </div>
            <div class="plan-dates">
              <div class="plan-date">
                <div class="plan-date-label">Started</div>
                <div class="plan-date-value">${formatDate(sub.start_date)}</div>
              </div>
              <div class="plan-date">
                <div class="plan-date-label">Ends</div>
                <div class="plan-date-value">${formatDate(sub.end_date)}</div>
              </div>
            </div>
            <div class="plan-progress">
              <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
              <div class="progress-text"><span>${progress}% complete</span><span>${progress >= 100 ? "Ended" : "Active"}</span></div>
            </div>
            <div class="plan-actions">
              <a href="/order" class="btn btn-secondary" style="flex:1;text-align:center;">Renew / New Plan</a>
            </div>
          </div>
        `;
          })
          .join("");
      }

      function renderMeals(meals) {
        const el = document.getElementById("meals-list");
        if (!meals?.length) {
          el.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 6v6l4 2"/></svg>
            <h3>No upcoming meals</h3>
            <p>Your next meals will appear here once scheduled.</p>
          </div>
        `;
          return;
        }
        el.innerHTML = `
        <div class="meal-list">
          ${meals
            .map(
              (m) => `
            <div class="meal-card">
              <div class="meal-date">${formatDateShort(m.delivery_date)}</div>
              <span class="meal-slot">${esc(m.slot)}</span>
              <div class="meal-item">${m.item_name ? esc(m.item_name) : "<em>Menu not set</em>"}</div>
              <span class="meal-status status-${esc(m.status) || "pending"}">${esc(m.status) || "pending"}</span>
            </div>
          `,
            )
            .join("")}
        </div>
      `;
      }

      function formatLocation(loc) {
        if (!loc) return "—";
        if (typeof loc === "string") return loc;
        if (typeof loc.areaName === "string") return loc.areaName;
        if (typeof loc.locationName === "string") return loc.locationName;
        if (loc.latitude && loc.longitude)
          return `${loc.latitude.toFixed(4)}, ${loc.longitude.toFixed(4)}`;
        return "—";
      }

      function renderProfile(data) {
        const el = document.getElementById("profile-info");
        const addresses = data.addresses || [];
        el.innerHTML = `
        <div class="profile-grid" id="profile-grid">
          <div class="profile-field"><div class="profile-label">Phone</div><div class="profile-value">${esc(data.phone)}</div></div>
          <div class="profile-field"><div class="profile-label">Name</div><div class="profile-value" id="profile-name-display">${esc(data.name) || "—"}</div></div>
          <div class="profile-field"><div class="profile-label">Email</div><div class="profile-value" id="profile-email-display">${esc(data.email) || "—"}</div></div>
        </div>
        <button class="btn btn-secondary" id="btn-edit-profile" style="margin-top:12px;">Edit Profile</button>

        <div id="profile-edit-form" style="display:none;margin-top:12px;">
          <div class="profile-field" style="margin-bottom:10px;">
            <div class="profile-label">Full Name</div>
            <input type="text" id="edit-name" value="${esc(data.name) || ""}" style="width:100%;padding:10px 12px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-family:inherit;font-size:0.9rem;" />
          </div>
          <div class="profile-field" style="margin-bottom:10px;">
            <div class="profile-label">Email</div>
            <input type="email" id="edit-email" value="${esc(data.email) || ""}" style="width:100%;padding:10px 12px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-family:inherit;font-size:0.9rem;" />
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-primary" id="btn-save-profile" style="flex:1;">Save</button>
            <button class="btn btn-secondary" id="btn-cancel-profile" style="flex:1;">Cancel</button>
          </div>
        </div>

        <div style="margin-top:20px;border-top:1px solid var(--gray-100);padding-top:16px;">
          <div class="profile-label" style="margin-bottom:8px;">Saved Addresses</div>
          <div id="addresses-list">
            ${
              addresses.length
                ? addresses
                    .map(
                      (a) => `
                <div style="border:1px solid var(--gray-200);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;">
                  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
                    <strong style="font-size:0.9rem;">${esc(a.label) || "Home"}</strong>
                    <span>
                      ${
                        a.is_default
                          ? '<span class="plan-type" style="margin-right:6px;">Default</span>'
                          : `<button class="btn btn-secondary" style="padding:4px 10px;font-size:0.75rem;" data-set-default="${esc(a.id)}">Set Default</button>`
                      }
                      <button class="btn btn-secondary" style="padding:4px 10px;font-size:0.75rem;margin-left:6px;" data-delete-address="${esc(a.id)}">Delete</button>
                    </span>
                  </div>
                  <div style="font-size:0.8rem;color:var(--gray-600);margin-top:6px;">${esc(a.address)}</div>
                  <div style="font-size:0.75rem;color:var(--gray-400);margin-top:2px;">${esc(formatLocation(a.location))}</div>
                </div>
              `,
                    )
                    .join("")
                : '<p style="font-size:0.82rem;color:var(--gray-500);">No saved addresses yet.</p>'
            }
          </div>
          <button class="btn btn-secondary" id="btn-add-address" style="margin-top:8px;">+ Add Address</button>
          <div id="add-address-form" style="display:none;margin-top:12px;">
            <input type="text" id="new-address-label" placeholder="Label (e.g. Home, Office)" style="width:100%;padding:10px 12px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-family:inherit;font-size:0.9rem;margin-bottom:8px;" />
            <input type="text" id="new-address-area" placeholder="Area / Neighbourhood" style="width:100%;padding:10px 12px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-family:inherit;font-size:0.9rem;margin-bottom:8px;" />
            <textarea id="new-address-text" placeholder="Flat/House No., Street, Landmark, City, PIN" style="width:100%;padding:10px 12px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-family:inherit;font-size:0.9rem;margin-bottom:8px;min-height:64px;"></textarea>
            <div style="display:flex;gap:8px;">
              <button class="btn btn-primary" id="btn-save-address" style="flex:1;">Save Address</button>
              <button class="btn btn-secondary" id="btn-cancel-address" style="flex:1;">Cancel</button>
            </div>
          </div>
        </div>
      `;

        document
          .getElementById("btn-edit-profile")
          .addEventListener("click", () => {
            document.getElementById("profile-grid").style.display = "none";
            document.getElementById("profile-edit-form").style.display =
              "block";
            document.getElementById("btn-edit-profile").style.display = "none";
          });
        document
          .getElementById("btn-cancel-profile")
          .addEventListener("click", () => {
            document.getElementById("profile-grid").style.display = "grid";
            document.getElementById("profile-edit-form").style.display = "none";
            document.getElementById("btn-edit-profile").style.display =
              "inline-flex";
          });
        document
          .getElementById("btn-save-profile")
          .addEventListener("click", async () => {
            const name = document.getElementById("edit-name").value.trim();
            const email = document.getElementById("edit-email").value.trim();
            try {
              const res = await fetch(`${API_BASE}/me`, {
                method: "PATCH",
                credentials: "include",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, email }),
              });
              if (!res.ok) throw new Error("Failed to update profile");
              document.getElementById("profile-name-display").textContent =
                name || "—";
              document.getElementById("profile-email-display").textContent =
                email || "—";
              document.getElementById("profile-grid").style.display = "grid";
              document.getElementById("profile-edit-form").style.display =
                "none";
              document.getElementById("btn-edit-profile").style.display =
                "inline-flex";
              document.getElementById("user-name").textContent =
                name || data.phone;
            } catch (err) {
              console.error("[DASHBOARD] Profile save failed:", err);
              alert("Could not save profile. Please try again.");
            }
          });

        document
          .getElementById("btn-add-address")
          .addEventListener("click", () => {
            document.getElementById("add-address-form").style.display = "block";
            document.getElementById("btn-add-address").style.display = "none";
          });
        document
          .getElementById("btn-cancel-address")
          .addEventListener("click", () => {
            document.getElementById("add-address-form").style.display = "none";
            document.getElementById("btn-add-address").style.display =
              "inline-flex";
          });
        document
          .getElementById("btn-save-address")
          .addEventListener("click", async () => {
            const label = document
              .getElementById("new-address-label")
              .value.trim();
            const area = document
              .getElementById("new-address-area")
              .value.trim();
            const address = document
              .getElementById("new-address-text")
              .value.trim();
            if (!address) {
              alert("Please enter the full address");
              return;
            }
            try {
              const res = await fetch(`${API_BASE}/addresses`, {
                method: "POST",
                credentials: "include",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  label: label || "Home",
                  address,
                  location: area || undefined,
                }),
              });
              if (!res.ok) throw new Error("Failed to add address");
              const updated = await res.json();
              renderProfile({ ...data, addresses: updated.addresses });
            } catch (err) {
              console.error("[DASHBOARD] Add address failed:", err);
              alert("Could not save address. Please try again.");
            }
          });

        document.querySelectorAll("[data-set-default]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const id = btn.dataset.setDefault;
            try {
              const res = await fetch(`${API_BASE}/addresses/${id}`, {
                method: "PATCH",
                credentials: "include",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ is_default: true }),
              });
              if (!res.ok) throw new Error("Failed to set default");
              const updated = await res.json();
              renderProfile({ ...data, addresses: updated.addresses });
            } catch (err) {
              console.error("[DASHBOARD] Set default failed:", err);
              alert("Could not update default address.");
            }
          });
        });

        document.querySelectorAll("[data-delete-address]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const id = btn.dataset.deleteAddress;
            if (!confirm("Delete this saved address?")) return;
            try {
              const res = await fetch(`${API_BASE}/addresses/${id}`, {
                method: "DELETE",
                credentials: "include",
              });
              if (!res.ok) throw new Error("Failed to delete address");
              const updated = await res.json();
              renderProfile({ ...data, addresses: updated.addresses });
            } catch (err) {
              console.error("[DASHBOARD] Delete address failed:", err);
              alert("Could not delete address.");
            }
          });
        });
      }

      async function loadDashboard() {
        try {
          const data = await fetchMe();
          document.getElementById("user-name").textContent =
            data.name || data.phone;
          renderSubscriptions(data.subscriptions);
          renderMeals(data.upcomingMeals);
          renderProfile(data);
        } catch (err) {
          console.error("[DASHBOARD] Load failed:", err);
          document.getElementById("subscriptions-list").innerHTML =
            '<div class="empty-state"><p>Failed to load data</p></div>';
          document.getElementById("meals-list").innerHTML =
            '<div class="empty-state"><p>Failed to load data</p></div>';
          document.getElementById("profile-info").innerHTML =
            '<div class="empty-state"><p>Failed to load data</p></div>';
        }
      }

      loadDashboard();
    </script>
    <script src="/js/nav.js" defer></script>
  </body>
</html>
